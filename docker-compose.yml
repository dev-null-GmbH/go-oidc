services:
  # This is a copy of the docker compose from the conformance suite repository
  # with some changes that allow the suite to call an authorization server running
  # on localhost.
  # The auth server is expected to be running under the domain "auth.localhost".
  mongodb:
    image: mongo:8.3.13@sha256:e16e606f792ea89d2b4907b54e5e31eb86a7a23e27231dce3a982cc8f2d73cd2
    command: ["mongod", "--ipv6", "--bind_ip_all"]
  nginx:
    build:
      context: ./conformance-suite/nginx
      dockerfile: Dockerfile-static
    ports:
     - "8443:8443"
     - "8444:8444"
     - "8445:8445"
    volumes:
     - ./conformance-suite/src/main/resources/:/usr/share/nginx/html/
     - ./examples/keys/server.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
     - ./examples/keys/server.key:/etc/ssl/private/nginx-selfsigned.key:ro
    depends_on:
     - server
  server:
    build:
      context: ./conformance-suite/server-dev
    ports:
     - "9999:9999"
    volumes:
     - ./conformance-suite/target/:/server/
    command: >
      java
      -Xdebug -Xrunjdwp:transport=dt_socket,address=*:9999,server=y,suspend=n
      -Djdk.tls.maxHandshakeMessageSize=65536
      -Djava.net.preferIPv6Addresses=true
      -jar /server/fapi-test-suite.jar
      --fintechlabs.base_url=https://conformance.localhost:8443
      --fintechlabs.base_mtls_url=https://conformance.localhost:8444
      --fintechlabs.devmode=true
      --fintechlabs.startredir=true
      --openid.mongodb.targetFeatureCompatibilityVersion=8.3
    depends_on:
     - mongodb
    logging:
      # limit logs retained on host
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"
    extra_hosts:
      # Requests to auth.localhost and matls-auth.localhost are forwarded to the
      # docker host where the authorization server is running.
      - auth.localhost:host-gateway
      - matls-auth.localhost:host-gateway
      - fed-trust-anchor.localhost:host-gateway
      - conformance.localhost:host-gateway

networks:
  default:
    enable_ipv6: true
