version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 10

  - package-ecosystem: gomod
    directory: /examples/vci
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Berlin
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Berlin
    groups:
      docker:
        patterns:
          - "*"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5
