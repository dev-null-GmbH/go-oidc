name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5

  govulncheck:
    name: Go vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/govulncheck-bin"
          mkdir -p "$tool_dir"
          GOBIN="$tool_dir" go install \
            golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$tool_dir/govulncheck" ./...

  vci-govulncheck:
    name: Nested VCI vulnerability analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/vci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/vci/go.mod
          cache-dependency-path: examples/vci/go.sum
          cache: true

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/govulncheck-bin"
          mkdir -p "$tool_dir"
          GOBIN="$tool_dir" go install \
            golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$tool_dir/govulncheck" ./...
