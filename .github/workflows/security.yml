name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: d0-untrusted
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 5

  govulncheck:
    name: Go vulnerability analysis
    runs-on: >-
      ${{ github.repository == 'dev-null-GmbH/go-oidc' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          'd0-trusted' || 'd0-untrusted' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/govulncheck-bin"
          mkdir -p "$tool_dir"
          GOBIN="$tool_dir" go install \
            golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$tool_dir/govulncheck" ./...

  vci-govulncheck:
    name: Nested VCI vulnerability analysis
    runs-on: >-
      ${{ github.repository == 'dev-null-GmbH/go-oidc' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request' &&
          'd0-trusted' || 'd0-untrusted' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/vci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: examples/vci/go.mod
          cache-dependency-path: examples/vci/go.sum
          cache: true

      - name: Run govulncheck
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/govulncheck-bin"
          mkdir -p "$tool_dir"
          GOBIN="$tool_dir" go install \
            golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$tool_dir/govulncheck" ./...

  supported-distribution:
    name: Rescan supported fork distribution
    if: >-
      github.repository == 'dev-null-GmbH/go-oidc' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: d0-trusted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.4
          cache: false
      - name: Install pinned advisory tools
        run: |
          tools="$RUNNER_TEMP/release-scanners"
          mkdir -p "$tools"
          GOBIN="$tools" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64 -o "$tools/osv-scanner"
          printf 'fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  %s\n' "$tools/osv-scanner" | sha256sum --check --strict
          chmod 0755 "$tools/osv-scanner"
          printf '%s\n' "$tools" >> "$GITHUB_PATH"
      - name: Verify and rescan exact public release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/rescan-release.sh "$RUNNER_TEMP/release-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fork-release-security-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence/
          retention-days: 30
          if-no-files-found: error
